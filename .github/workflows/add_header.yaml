name: Add header service

on: # The events that trigger the workflow
  push:
    branches:
      - test #Trigger on push to the 'main' branch
    paths:
      - "**/*"
  pull_request:
    branches:
      - main # Trigger when a pull request is made to 'main'

env:
  GCP_PROJECT_ID: polar-strata-450805-e9
  GCP_SERVICE_ACCOUNT: github-actions@polar-strata-450805-e9.iam.gserviceaccount.com
  GCP_ARTIFACT_REPO: add-header-image
  GCP_ARTIFACT_IMAGE: addheader
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/960080975345/locations/global/workloadIdentityPools/github-pool/providers/github
jobs:
  build: # Define jobs that will run in this workflow
    runs-on: ubuntu-latest # The operating system to run the job
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      #TEST
      - name: Google SDK auth
        id: google-auth
        uses: "google-github-actions/auth@v2"
        with:
          token_format: 'access_token'
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Docker Auth
        uses: "docker/login-action@v3"
        with:
          username: "oauth2accesstoken"
          password: ${{ secrets.GOOGLE_CREDENTIALS }}
          registry: us-east4-docker.pkg.dev
      #test
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
      - name: proxy-wasm-cpp-sdk
        run: |
          cd proxy-wasm-cpp-sdk
          ls -l
          docker build -t wasmsdk:v3 -f Dockerfile-sdk .
      - name: Change Dir to addheader
        run: |
          ls -l proxy-wasm-cpp-sdk
          docker run -v $(pwd):/work -w /work wasmsdk:v3 /build_wasm.sh addheader.wasm
          docker commit `docker ps -l | grep wasmsdk:v3 | awk '{print $1}'` wasmsdk:v3
      - name: Copy wasm file to package dir
        run: |
          cp -f addheader.wasm package/plugin.wasm
      # - name: Set up Google Cloud SDK
      #   uses: google-github-actions/setup-gcloud@v2
      #   with:
      #     project_id: ${{ env.GCP_PROJECT_ID }}
      #     credentials_json: ${{secrets.GOOGLE_CREDENTIALS}}'
      # # Configure Docker to use Google Cloud Artifact Registry
      # - name: Configure Docker to use Artifact Registry
      #   run: |
      #     gcloud auth configure-docker us-east4-docker.pkg.dev
      - name: Build Docker image
        run: |
          docker build --no-cache --platform wasm -t ${{env.GCP_ARTIFACT_IMAGE}} package/
      # - name: Docker Auth
      #   run: |
      #     gcloud auth print-access-token --impersonate-service-account ${{env.GCP_SERVICE_ACCOUNT}} | docker login -u oauth2accesstoken --password-stdin https://us-east4-docker.pkg.dev
      # - name: Google SDK auth
      #   id: google-auth
      #   uses: "google-github-actions/auth@v2"
      #   with:
      # #    credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      #     token_format: 'access_token'
      #     project_id: ${{ env.GCP_PROJECT_ID }}
      #     workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      #     service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      # - name: Docker Auth
      #   uses: "docker/login-action@v3"
      #   with:
      #     username: "oauth2accesstoken"
      #     password: ${{ secrets.GOOGLE_CREDENTIALS }}
      #     registry: us-east4-docker.pkg.dev
      - name: Push Docker image to Artifact Registry
        run: |
          docker tag ${{env.GCP_ARTIFACT_IMAGE}} us-east4-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/${{ env.GCP_ARTIFACT_IMAGE}}:prod
          docker push us-east4-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/${{ env.GCP_ARTIFACT_IMAGE}}:prod